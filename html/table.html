<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 테이블 -->
    <table border="1">
        <!-- 테이블 헤더 -->
        <thead>
            <!-- tr : table row -->
             <tr>
                <th>ID</th>
                <th>이름</th>
                <th>이메일</th>
             </tr>
        </thead>
        <!-- 테이블 바디 -->
        <tbody>
            <tr>
                <td>1</td>
                <td>alex</td>
                <td>alex@example.com</td>
            </tr>
            <tr>
                <td>2</td>
                <td>bob</td>
                <td>bob@example.com</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
