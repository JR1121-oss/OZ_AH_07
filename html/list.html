<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--list : 여러 개의 데이터를 출력-->
    자신있는 프로그램 언어
    <!-- ul : Unordered List -->
    <ul>
        <!-- li: List Item -->
         <li>Python</li>
         <li>HTML</li>
         <li>CSS</li>
    </ul>    
    <hr>
    <!-- ol: Ordered List -->
    <!-- 속성(Attribute) -->
     <ol start = "0">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
     </ol>
</body>
</html>
