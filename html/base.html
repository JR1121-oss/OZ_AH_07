<!DOCTYPE html>
<!-- 주석은 이렇게 양옆에 써야함 -->

<html>
    <!--헤드: 화면에 대한 부가 정보(눈에 안보임)-->
    <head>
        <title>My Page</title>
    </head>

    <!--바디(본문): 웹 페이지의 실제 화면-->
    <body>
        <!--헤딩: 제목(텍스트를 강조)-->
        <h1>HTML 기초/h1>
        <h2>HTML의 특징</h2>
        <h3>1. HTML은 tag로 이루어진다.</h3>
        <!--문단(paragraph)-->
        <p>모든 HTML은 tag의 형태로 작성된다.
    </body>
</html>
