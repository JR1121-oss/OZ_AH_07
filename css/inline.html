<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: orange;
            border: 1px solid black;
        }
        span {
            background-color: skyblue;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- Block-level 요소: 가로 한줄 전체 차지 -->
    <!-- Inline 요소 -->

    <div>A</div>
    <div>B</div>
    <div>C</div>

    <!-- Inline 요소 -->
    <strong>Lorem</strong> ipsum dolor <span>Inline</span> sit amet consectetur adipisicing elit. <a href="">구글로 이동</a> Corrupti eos fugit <span>Inline</span> maxime nobis cum deserunt culpa dignissimos. <span>Inline</span> Enim, laboriosam tenetur repudiandae fugit ad alias quas ipsum sapiente asperiores saepe eaque.
</body>
</html>
