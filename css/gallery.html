<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            padding: 10%;
            display: grid;
            gap: 0.8rem;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(4, 200px);
        
            grid-template-areas:
                "img1 img3 img3"
                "img1 img4 img6"
                "img2 img2 img6"
                "img5 img5 img5";
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.6rem;
        }

        .container:hover img:not(:hover){
            filter: grayscale(1);
            opacity: 0.5;
        }

        .img1 {
            grid-area: img1;
        }
        .img2 {
            grid-area: img2;
        }
        .img3 {
            grid-area: img3
        }
        .img4 {
            grid-area: img4
        }
        .img5 {
            grid-area:img5
        }
        .img6 {
            grid-area: img6
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- .item.img$*6 -->
        <div class="item img1"><img src="https://images.unsplash.com/photo-1791391279415-fefa6e26f0e2?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img2"><img src="https://images.unsplash.com/photo-1791542877888-1e019b86fd9b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img3"><img src="https://images.unsplash.com/photo-1791965558107-72f16827afc9?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img4"><img src="https://images.unsplash.com/photo-1790123787069-f92504f555ff?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img5"><img src="https://images.unsplash.com/photo-1790274742524-5cc9cb0c10c3?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDE%3D" alt=""></div>
        <div class="item img6"><img src="https://images.unsplash.com/photo-1791563037284-abd6923d4261?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
    </div>
</body>
</html>
